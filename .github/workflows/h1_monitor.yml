name: HackerOne Scope Monitor

on:
  schedule:
    # التكرار كل 6 ساعات (في الدقيقة 0 من الساعات: 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # يتيح لك تشغيل السكربت يدويًا في أي وقت للتجربة

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Monitor Script
        env:
          H1_USERNAME: ${{ secrets.H1_USERNAME }}
          H1_PASSWORD: ${{ secrets.H1_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python h1_monitor.py

      - name: Commit and Push Updated DB
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add h1_scopes_db.json
          # التأكد من وجود تغييرات في ملف JSON قبل العمل Commit لمنع الأخطاء
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update h1 scopes db [skip ci]" && git push)
